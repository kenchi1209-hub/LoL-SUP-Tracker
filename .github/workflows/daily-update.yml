name: Daily LoL Data Update

on:
  schedule:
    # 毎日 10:00 JST (= 01:00 UTC) に実行
    - cron: "0 1 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # data/raw は .gitignore 対象（試合詳細JSONのローカルキャッシュ）。
      # キャッシュしないと毎回全試合分をRiot APIから再取得することになるため、
      # runサンをまたいで復元する。
      - name: Restore raw match cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-matches-${{ github.run_id }}
          restore-keys: |
            raw-matches-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # main.py が データ取得 → participants/my_matches/report/review/summary/monthly/yearly
      # → Excelレポート(data/excel/lol_report.xlsx) まで一括で生成する
      - name: Fetch match data and generate reports (CSV / TXT / Excel)
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          RIOT_GAME_NAME: ${{ secrets.RIOT_GAME_NAME }}
          RIOT_TAG_LINE: ${{ secrets.RIOT_TAG_LINE }}
        run: python main.py

      - name: Upload Excel report artifact
        uses: actions/upload-artifact@v4
        with:
          name: lol-report
          path: data/excel/lol_report.xlsx
          if-no-files-found: error
          retention-days: 30

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data && git diff --cached --quiet -- data && \
             [ -z "$(git ls-files --others --exclude-standard -- data)" ]; then
            echo "データに変更はありません。commitをスキップします"
            exit 0
          fi

          git add data
          git commit -m "Update LoL data $(date -u +%Y-%m-%d)"
          git push
