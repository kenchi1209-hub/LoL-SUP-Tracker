name: Build & Deploy site

on:
  push:
    branches: [build]
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      private_data_pushed:
        description: "Build and deploy the current PrivateData commit without fetching Riot data"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: private-data-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tracker
        uses: actions/checkout@v4
        with:
          path: tracker

      - name: Checkout PrivateData
        uses: actions/checkout@v4
        with:
          repository: kenchi1209-hub/LoL-SUP-Tracker-PrivateData
          ref: main
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
          path: private-data

      - name: Record base revisions
        id: bases
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.private_data_pushed)
        run: |
          set -euo pipefail
          test -z "$(git -C tracker status --porcelain)"
          test -z "$(git -C private-data status --porcelain)"
          echo "tracker_sha=$(git -C tracker rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "private_sha=$(git -C private-data rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: tracker
        run: python -m pip install -r requirements.txt

      - name: Refresh Champion Registry
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.private_data_pushed)
        working-directory: tracker
        run: python champion_registry.py update

      - name: Fetch latest match data into PrivateData
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.private_data_pushed)
        working-directory: tracker
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          RIOT_GAME_NAME: ${{ secrets.RIOT_GAME_NAME }}
          RIOT_TAG_LINE: ${{ secrets.RIOT_TAG_LINE }}
        run: python main.py --data-root "${{ github.workspace }}/private-data"

      - name: Verify PrivateData completeness
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.private_data_pushed)
        working-directory: tracker
        run: >-
          python verify_fight_raw_completeness.py
          --data-root "${{ github.workspace }}/private-data"

      - name: Commit refreshed PrivateData
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.private_data_pushed)
        working-directory: private-data
        env:
          PRIVATE_BASE_SHA: ${{ steps.bases.outputs.private_sha }}
        run: |
          set -euo pipefail

          if ! git diff --quiet -- raw; then
            echo "Existing PrivateData raw was modified or deleted; refusing to commit" >&2
            git diff --name-status -- raw >&2
            exit 1
          fi
          deleted=$(git diff --name-only --diff-filter=D -- raw csv excel)
          if [ -n "$deleted" ]; then
            echo "PrivateData files were deleted; refusing to commit" >&2
            printf '%s\n' "$deleted" >&2
            exit 1
          fi
          outside_data=$(git status --porcelain -- . ':(exclude)raw' ':(exclude)csv' ':(exclude)excel')
          if [ -n "$outside_data" ]; then
            echo "PrivateData has changes outside raw/csv/excel; refusing to commit" >&2
            printf '%s\n' "$outside_data" >&2
            exit 1
          fi

          git fetch origin main
          remote_sha=$(git rev-parse origin/main)
          if [ "$remote_sha" != "$PRIVATE_BASE_SHA" ]; then
            echo "PrivateData main advanced during this run; refusing to push" >&2
            exit 1
          fi

          git add -- raw csv excel
          unexpected=$(git diff --cached --name-only | awk '!/^(raw|csv|excel)\//')
          if [ -n "$unexpected" ]; then
            echo "Refusing to stage files outside raw/csv/excel" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          git -c core.whitespace=cr-at-eol diff --cached --check
          if git diff --cached --quiet; then
            echo "No PrivateData changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Update LoL data $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi

      - name: Commit Champion Registry only
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.private_data_pushed)
        working-directory: tracker
        env:
          TRACKER_BASE_SHA: ${{ steps.bases.outputs.tracker_sha }}
        run: |
          set -euo pipefail
          unexpected=$(git status --porcelain -- . ':(exclude)data/csv/champion_registry.json')
          if [ -n "$unexpected" ]; then
            echo "Public changes outside Champion Registry are not allowed" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

          git fetch origin build
          remote_sha=$(git rev-parse origin/build)
          if [ "$remote_sha" != "$TRACKER_BASE_SHA" ]; then
            echo "Public build advanced during this run; refusing to push" >&2
            exit 1
          fi

          git add -- data/csv/champion_registry.json
          unexpected=$(git diff --cached --name-only | awk '!/^data\/csv\/champion_registry\.json$/')
          if [ -n "$unexpected" ]; then
            echo "Refusing to stage Public data outside Champion Registry" >&2
            exit 1
          fi
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Champion Registry is unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Champion Registry $(date -u +%Y-%m-%d)"
            git push origin HEAD:build
          fi

      - name: Build static site from PrivateData
        working-directory: tracker
        env:
          RIOT_GAME_NAME: ${{ secrets.RIOT_GAME_NAME }}
          RIOT_TAG_LINE: ${{ secrets.RIOT_TAG_LINE }}
        run: python build_site.py --data-root "${{ github.workspace }}/private-data"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tracker/public

      - name: Upload Excel report artifact
        uses: actions/upload-artifact@v4
        with:
          name: lol-report
          path: private-data/excel/lol_report.xlsx
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
